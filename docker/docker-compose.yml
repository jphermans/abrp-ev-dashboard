# ═════════════════════════════════════════════════════════════════
# ABRP EV Dashboard — Docker Compose
# Low-resource config for Raspberry Pi 4/5
# ═════════════════════════════════════════════════════════════════

services:
  abrp-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: abrp-dashboard
    restart: unless-stopped

    ports:
      - "${ABRP_PORT:-8765}:8000"

    # Persistent data (Excel uploads + cached JSON)
    volumes:
      - ./data:/app/data

    # Resource limits — keep it light on the Pi
    # Note: deploy.resources requires Swarm or docker compose v2+
    # On older kernels (cgroup v1) memory limits may be silently ignored
    mem_limit: 256m
    cpus: 0.5

    # Environment
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1

    # Health check — verify the server responds
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging — prevent log files from growing unbounded
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
